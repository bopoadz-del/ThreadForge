services:
  threadforge:
    build: .
    ports:
      - "8000:8000"
    environment:
      TF_DATA: /data
      TF_API_TOKENS: engineer:eng-token:write,reviewer:rev-token:read
    volumes:
      - tfdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  tfdata:
