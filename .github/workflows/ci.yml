name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,ifc,dxf,xsd,server]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy
        run: mypy --strict src
      - name: Pytest
        run: pytest -q
      - name: OpenAPI dump/diff
        run: python scripts/openapi_diff.py
      - name: Golden baseline PCF fails contiguity reader
        run: |
          python - <<'PY'
          from pathlib import Path
          from threadforge.pcf_reader import parse_pcf, assert_contiguous, overlaps_pipe_elbow, PCFParseError
          doc = parse_pcf(Path("tests/golden/baseline/pcf/120-P-1001.pcf"))
          assert overlaps_pipe_elbow(doc), "baseline must show elbow overlap defect"
          try:
              assert_contiguous(doc)
              raise SystemExit("baseline should fail contiguity")
          except PCFParseError:
              pass
          print("baseline defect confirmed")
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t threadforge:ci .
      - name: Container health
        run: |
          docker run -d --name tfci -p 8000:8000 -e TF_DATA=/data threadforge:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health | grep -q status; then
              echo healthy
              docker rm -f tfci
              exit 0
            fi
            sleep 2
          done
          docker logs tfci || true
          docker rm -f tfci
          exit 1
      - name: Write docker_health evidence
        run: |
          mkdir -p artifacts/ci
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          sha = os.environ.get("GITHUB_SHA") or subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          Path("artifacts/ci").mkdir(parents=True, exist_ok=True)
          Path("artifacts/ci/docker_health.json").write_text(
              json.dumps(
                  {"sha": sha, "status": "healthy", "image": "threadforge:ci"},
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          print("wrote artifacts/ci/docker_health.json for", sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: docker_health
          path: artifacts/ci/docker_health.json

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,ifc,dxf,xsd,server]"
      - name: Acceptance A01–A30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/acceptance.py
