name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,ifc,dxf,xsd,server,pdf]"
      - name: Standing gate
        run: |
          ruff check src tests scripts
          mypy --strict src
          pytest -q -p no:cacheprovider
          python scripts/dump_openapi.py /tmp/oa.json
          diff -q openapi.json /tmp/oa.json
          python scripts/mutation_probes.py
      - name: Golden baseline PCF fails contiguity reader
        run: |
          python - <<'PY'
          from pathlib import Path
          from threadforge.pcf_reader import parse_pcf, assert_contiguous, overlaps_pipe_elbow, PCFParseError
          doc = parse_pcf(Path("tests/golden/baseline/pcf/120-P-1001.pcf"))
          assert overlaps_pipe_elbow(doc), "baseline must show elbow overlap defect"
          try:
              assert_contiguous(doc)
              raise SystemExit("baseline should fail contiguity")
          except PCFParseError:
              pass
          print("baseline defect confirmed")
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Docker build
        run: docker build -t threadforge:ci .
      - name: Container health + authenticated /tools
        env:
          TF_API_TOKENS: engineer:eng-token:write
        run: |
          DIGEST=$(docker inspect --format='{{.Id}}' threadforge:ci)
          docker run -d --name tfci -p 8000:8000 \
            -e TF_DATA=/data \
            -e TF_API_TOKENS="$TF_API_TOKENS" \
            threadforge:ci
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/tf_health.json -w '%{http_code}' http://127.0.0.1:8000/health || true)
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            docker logs tfci || true
            docker rm -f tfci || true
            exit 1
          fi
          HEALTH_STATUS=$(curl -sS -o /tmp/tf_health.json -w '%{http_code}' http://127.0.0.1:8000/health)
          UNAUTH=$(curl -sS -o /tmp/tf_tools_unauth.json -w '%{http_code}' http://127.0.0.1:8000/tools)
          AUTH=$(curl -sS -o /tmp/tf_tools_auth.json -w '%{http_code}' \
            -H "Authorization: Bearer eng-token" http://127.0.0.1:8000/tools)
          echo "health=$HEALTH_STATUS unauth=$UNAUTH auth=$AUTH digest=$DIGEST"
          test "$HEALTH_STATUS" = "200"
          test "$UNAUTH" = "401"
          test "$AUTH" = "200"
          python scripts/ci_write_docker_health.py \
            --sha "${GITHUB_SHA}" \
            --health-status "$HEALTH_STATUS" \
            --health-body /tmp/tf_health.json \
            --tools-unauth "$UNAUTH" \
            --tools-auth "$AUTH" \
            --image-digest "$DIGEST"
          docker rm -f tfci
      - uses: actions/upload-artifact@v4
        with:
          name: docker_health
          path: artifacts/ci/docker_health.json

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,ifc,dxf,xsd,server,pdf]"
      - name: Acceptance A01–A30 / B01–B40
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/acceptance.py

  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,ifc,dxf,xsd,server,pdf]"
      - name: Mutation probes
        run: python scripts/mutation_probes.py

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: GHCR login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/threadforge:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
