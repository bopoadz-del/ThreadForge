name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tf
          POSTGRES_USER: tf
          POSTGRES_DB: threadforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tf -d threadforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TF_POSTGRES_URL: postgresql+psycopg://tf:tf@localhost:5432/threadforge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,ifc,dxf,xsd,server,pdf,db]"
      - name: Standing gate
        run: |
          ruff check src tests scripts
          mypy --strict src
          pytest -q -p no:cacheprovider
          python scripts/dump_openapi.py /tmp/oa.json
          diff -q openapi.json /tmp/oa.json
          python scripts/mutation_probes.py
      - name: Golden baseline PCF fails contiguity reader
        run: |
          python - <<'PY'
          from pathlib import Path
          from threadforge.pcf_reader import parse_pcf, assert_contiguous, overlaps_pipe_elbow, PCFParseError
          doc = parse_pcf(Path("tests/golden/baseline/pcf/120-P-1001.pcf"))
          assert overlaps_pipe_elbow(doc), "baseline must show elbow overlap defect"
          try:
              assert_contiguous(doc)
              raise SystemExit("baseline should fail contiguity")
          except PCFParseError:
              pass
          print("baseline defect confirmed")
          PY

  docker:
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: GHCR login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull published image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/threadforge:${GITHUB_SHA}"
          docker pull "$IMAGE"
          docker tag "$IMAGE" threadforge:ci
      - name: Container health + authenticated /tools
        env:
          TF_API_TOKENS: engineer:eng-token:write
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/threadforge:${GITHUB_SHA}"
          REPO_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          DIGEST="${REPO_DIGEST##*@}"
          echo "repo_digest=$REPO_DIGEST digest=$DIGEST"
          docker run -d --name tfci -p 8000:8000 \
            -e TF_DATA=/data \
            -e TF_API_TOKENS="$TF_API_TOKENS" \
            threadforge:ci
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/tf_health.json -w '%{http_code}' http://127.0.0.1:8000/health || true)
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            docker logs tfci || true
            docker rm -f tfci || true
            exit 1
          fi
          HEALTH_STATUS=$(curl -sS -o /tmp/tf_health.json -w '%{http_code}' http://127.0.0.1:8000/health)
          UNAUTH=$(curl -sS -o /tmp/tf_tools_unauth.json -w '%{http_code}' http://127.0.0.1:8000/tools)
          AUTH=$(curl -sS -o /tmp/tf_tools_auth.json -w '%{http_code}' \
            -H "Authorization: Bearer eng-token" http://127.0.0.1:8000/tools)
          echo "health=$HEALTH_STATUS unauth=$UNAUTH auth=$AUTH digest=$DIGEST"
          test "$HEALTH_STATUS" = "200"
          test "$UNAUTH" = "401"
          test "$AUTH" = "200"
          python scripts/ci_write_docker_health.py \
            --sha "${GITHUB_SHA}" \
            --health-status "$HEALTH_STATUS" \
            --health-body /tmp/tf_health.json \
            --tools-unauth "$UNAUTH" \
            --tools-auth "$AUTH" \
            --image-digest "$DIGEST"
          docker rm -f tfci
      - uses: actions/upload-artifact@v4
        with:
          name: docker_health
          path: artifacts/ci/docker_health.json

  acceptance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tf
          POSTGRES_USER: tf
          POSTGRES_DB: threadforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tf -d threadforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TF_POSTGRES_URL: postgresql+psycopg://tf:tf@localhost:5432/threadforge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,ifc,dxf,xsd,server,pdf,db]"
      - name: Acceptance A01–A30 / B01–B40
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python scripts/acceptance.py

  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,ifc,dxf,xsd,server,pdf]"
      - name: Mutation probes
        run: python scripts/mutation_probes.py

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: GHCR login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          SHORT="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          BASE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/threadforge"
          docker build -t "${BASE}:${GITHUB_SHA}" -t "${BASE}:sha-${SHORT}" .
          docker push "${BASE}:${GITHUB_SHA}"
          docker push "${BASE}:sha-${SHORT}"
          if [ "${GITHUB_REF}" = "refs/tags/v2.0.0" ]; then
            docker tag "${BASE}:${GITHUB_SHA}" "${BASE}:v2.0.0"
            docker push "${BASE}:v2.0.0"
          fi
  release:
    if: github.ref == 'refs/tags/v2.0.0'
    runs-on: ubuntu-latest
    needs: [test, docker, probes, publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + wheel + SBOM + acceptance table
        run: |
          python -m pip install -U pip build
          pip install -e ".[dev,ifc,dxf,xsd,server,pdf,db]"
          python -m build --wheel
          python scripts/write_sbom.py artifacts/sbom.cdx.json
          python scripts/write_acceptance_table.py artifacts/acceptance.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.0.0 \
            dist/threadforge-2.0.0-*.whl \
            artifacts/sbom.cdx.json \
            artifacts/acceptance.md \
            --title "ThreadForge v2.0.0" \
            --notes "See artifacts/acceptance.md for A01–A30 / B01–B40."
