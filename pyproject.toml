[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threadforge"
version = "0.1.0"
description = "Agent-native EPC digital-thread MVP: P&ID → topology → layout → piping → AWP/4D"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ThreadForge Contributors" }]
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8", "httpx>=0.27"]
ifc = ["ifcopenshell>=0.7"]
dxf = ["ezdxf>=1.0"]
xsd = ["lxml>=4.9", "xmlschema>=3.3"]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
# Render deploy uses .[all] — keep lean (skip heavy ifcopenshell on free/starter builds)
all = ["threadforge[server,dev]"]

[project.scripts]
threadforge = "threadforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
