[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threadforge"
version = "1.0.1"
description = "Agent-native EPC digital-thread MVP: P&ID → topology → layout → piping → AWP/4D"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ThreadForge Contributors" }]
dependencies = [
  "pydantic>=2.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8", "httpx>=0.27"]
ifc = ["ifcopenshell>=0.7"]
dxf = ["ezdxf>=1.0"]
xsd = ["lxml>=4.9", "xmlschema>=3.3"]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
xlsx = ["openpyxl>=3.1"]
all = ["threadforge[dev,ifc,dxf,xsd,server,xlsx]"]

[project.scripts]
threadforge = "threadforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741", "F811"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
follow_imports = "silent"
disallow_untyped_calls = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["ifcopenshell.*", "ezdxf.*", "lxml.*", "xmlschema.*", "uvicorn.*", "openpyxl.*"]
ignore_missing_imports = true
